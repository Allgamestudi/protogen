; PlatformIO config for ESP32-C3 Super Mini
; Build & upload from VS Code with the PlatformIO IDE extension.

[env:esp32c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; USB CDC On Boot — required for our USB serial protocol
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0

lib_deps =
    kosme/arduinoFFT@^2.0.4

; Serial port — adjust if your ESP enumerates as a different name.
;   Linux/macOS: usually /dev/ttyACM0
;   Windows:     usually COM3 / COM4 / ...
upload_port  = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; Filter raw bytes nicely in the monitor
monitor_filters = esp32_exception_decoder, time
