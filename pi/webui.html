<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>Protogen</title>
<style>
:root{--bg:#0d0f14;--card:#171a22;--card2:#1f2330;--line:#2a2f3d;--text:#eef0f5;--dim:#9299ab;
  --accent:#ff3d3d;--ok:#37d67a;--warn:#ffb020;--bad:#ff5a5a;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
h2{font-size:1em;margin:0 0 10px;letter-spacing:.2px}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}

/* top: name, link, language */
header{display:flex;align-items:center;gap:10px;padding:10px 0 6px}
header .name{font-weight:700;font-size:1.1em;flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px currentColor}
.dot.on{background:var(--ok)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:.85em;color:var(--dim)}
button.chip{cursor:pointer;color:var(--text)}

/* the face, live */
#stage{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,transparent);padding:4px 0 10px}
.screen{position:relative;background:#000;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  box-shadow:0 0 28px -8px var(--accent)}
.screen canvas{display:block;width:100%;image-rendering:pixelated;aspect-ratio:4/1}
.screen .grid{position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle,transparent 52%,rgba(0,0,0,.82) 62%);background-size:calc(100%/128) calc(100%/32)}
.screen .wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:.9em}
.statusrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.statusrow .grow{flex:1}

/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(18,20,27,.96);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:760px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:0;padding:8px 2px 9px;color:var(--dim);cursor:pointer;font-size:.72em;min-width:0}
nav button .i{display:block;font-size:1.65em;line-height:1.15}
nav button.on{color:var(--text)}
nav button.on .i{filter:drop-shadow(0 0 6px var(--accent))}
.tab{display:none}.tab.on{display:block}

/* cards and controls */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px;margin:10px 0}
.row>label,.row>.lab{flex:0 0 38%;color:var(--dim)}
.row>.ctl{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.btn{color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 6px;cursor:pointer;color:var(--dim);white-space:nowrap}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:28px}
input[type=text],select{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;flex:1}
input[type=color]{width:46px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card2);padding:3px}
.val{min-width:4.2em;text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.sw{flex:none;width:50px;height:30px;border-radius:999px;background:var(--card2);border:1px solid var(--line);position:relative;cursor:pointer;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:.15s}
.sw.on{background:var(--accent);border-color:transparent}.sw.on::after{left:23px;background:#fff}

/* emotions */
.emos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.emo{background:var(--card2);border:2px solid transparent;border-radius:12px;padding:10px 4px 8px;cursor:pointer;text-align:center}
.emo .e{font-size:1.9em;line-height:1.1;display:block}
.emo .n{font-size:.78em;color:var(--dim);display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emo.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--card2))}
.emo.shown{box-shadow:inset 0 0 0 1px var(--warn)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.q{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:12px;padding:9px 10px}
.q .t{flex:1;font-size:.9em;cursor:pointer}
.q .t::after{content:" ⓘ";color:var(--dim);font-size:.85em}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.modes button{background:var(--card2);border:2px solid transparent;border-radius:12px;padding:9px 2px;cursor:pointer;font-size:.78em;color:var(--dim)}
.modes button .i{display:block;font-size:1.7em}
.modes button.on{border-color:var(--accent);color:var(--text)}

/* settings */
.search{display:flex;gap:8px;margin-bottom:10px}
.group>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
.group>summary::-webkit-details-marker{display:none}
.group>summary .gi{font-size:1.5em}
.group>summary .gt{flex:1}
.group>summary .gt small{display:block;color:var(--dim);font-weight:400}
.group>summary::after{content:"▾";color:var(--dim)}
.group[open]>summary::after{content:"▴"}
.set{border-top:1px solid var(--line);padding:11px 0 9px}
.set .top{display:flex;align-items:center;gap:10px}
.set .nm{flex:1;cursor:pointer}
.set .nm::after{content:" ⓘ";color:var(--dim);font-size:.85em}
.set.mod .nm::before{content:"● ";color:var(--warn);font-size:.7em;vertical-align:middle}
.set .sl{display:flex;align-items:center;gap:8px;margin-top:4px}
.set .step{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card2);cursor:pointer;flex:none}
.set .help{display:none;margin-top:8px;padding:10px 12px;background:var(--card2);border-radius:10px;color:#cfd4e2;font-size:.92em}
.set.open .help{display:block}
.set .help .def{display:flex;gap:10px;align-items:center;margin-top:8px;color:var(--dim);font-size:.9em}
.set .help .def button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
.hint{color:var(--dim);font-size:.88em}
pre.log{white-space:pre-wrap;background:var(--card2);border-radius:10px;padding:10px;font-size:.85em;margin:8px 0 0;max-height:180px;overflow:auto}
.rings{display:flex;justify-content:center;gap:26px}
.rings canvas{width:110px;height:110px}

/* messages */
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;
  background:#000;border:1px solid var(--line);border-radius:12px;padding:10px 16px;opacity:0;pointer-events:none;transition:.2s;max-width:90%}
#toast.on{opacity:1}
#offline{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--bad);color:#fff;text-align:center;padding:7px;display:none;font-weight:600}
#offline.on{display:block}
#sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .box{background:var(--card);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-width:760px;width:100%}
#sheet h3{margin:0 0 8px}
#sheet p{margin:0 0 14px;color:#cfd4e2}
</style>
</head>
<body>
<div id="offline" data-t="offline"></div>
<div class="wrap">
  <header>
    <span class="dot" id="link" title=""></span>
    <span class="name">Protogen</span>
    <span class="chip" id="simBadge" style="display:none" data-t="simulator"></span>
    <button class="chip" id="lang">RU</button>
  </header>

  <section id="stage">
    <div class="screen">
      <canvas id="face" width="128" height="32"></canvas>
      <div class="grid" id="grid"></div>
      <div class="wait" id="wait" data-t="waiting"></div>
    </div>
    <div class="statusrow">
      <span class="chip" id="stShown"></span>
      <span class="chip" id="stState"></span>
      <span class="chip" id="stEsp"></span>
      <span class="grow"></span>
      <span class="chip">☀ <span id="brV">–</span></span>
    </div>
    <div class="row" style="margin:6px 0 0"><input type="range" id="bright" min="5" max="100" step="1" aria-label="brightness"></div>
  </section>

  <!-- Face -->
  <div class="tab on" id="tab-face">
    <div class="card">
      <h2 data-t="emotions"></h2>
      <div class="emos" id="emos"></div>
      <div class="btns" style="margin-top:12px;flex-wrap:nowrap">
        <button class="btn" id="winkL" style="flex:1">😉 <span data-t="winkLeft"></span></button>
        <button class="btn" id="winkR" style="flex:1"><span data-t="winkRight"></span> 😉</button>
      </div>
    </div>
    <div class="card">
      <h2 data-t="quick"></h2>
      <div class="quick" id="quick"></div>
      <div class="row"><span class="lab" data-t="liveliness"></span>
        <div class="ctl"><input type="range" id="qLive" min="0" max="2" step="0.1"><span class="val" id="qLiveV"></span></div></div>
    </div>
  </div>

  <!-- Look -->
  <div class="tab" id="tab-look">
    <div class="card">
      <h2 data-t="colourMode"></h2>
      <div class="seg" id="effects"></div>
      <p class="hint" id="effectHint"></p>
    </div>
    <div class="card" id="cardColour">
      <h2 data-t="colour"></h2>
      <div class="row"><div class="ctl"><input type="color" id="color"><div class="swatches" id="swatches"></div></div></div>
      <p class="hint" data-t="colourHint"></p>
    </div>
    <div class="card" id="cardGrad">
      <h2 data-t="gradient"></h2>
      <div class="row"><span class="lab" data-t="gradColours"></span><div class="ctl"><input type="color" id="g1"><input type="color" id="g2"></div></div>
      <div class="row"><span class="lab" data-t="gradAngle"></span><div class="ctl"><input type="range" id="gAngle" min="0" max="360" step="5"><span class="val" id="gAngleV"></span></div></div>
    </div>
    <div class="card">
      <h2 data-t="panels"></h2>
      <div class="row"><span class="lab" data-t="mirror"></span><div class="ctl"><div class="sw" id="mirror"></div><span class="hint" data-t="mirrorHint"></span></div></div>
      <div class="row"><span class="lab" data-t="rotate"></span><div class="ctl"><div class="sw" id="rotate"></div><span class="hint" data-t="rotateHint"></span></div></div>
    </div>
  </div>

  <!-- Show (modes) -->
  <div class="tab" id="tab-show">
    <div class="card">
      <h2 data-t="whatToShow"></h2>
      <div class="modes" id="modes"></div>
    </div>
    <div class="card" data-mode="image">
      <h2 data-t="picture"></h2>
      <div class="btns"><label class="btn pri"><span data-t="choosePicture"></span><input type="file" id="file" accept="image/*" hidden></label></div>
      <p class="hint" id="upMsg" data-t="pictureHint"></p>
    </div>
    <div class="card" data-mode="text">
      <h2 data-t="text"></h2>
      <div class="row"><div class="ctl"><input type="text" id="txt" maxlength="200"><input type="color" id="txtColor"></div></div>
      <div id="textSets"></div>
    </div>
    <div class="card" data-mode="eq">
      <h2 data-t="equaliser"></h2>
      <div class="seg" id="eqKind"></div>
      <p class="hint" data-t="eqHint"></p>
    </div>
    <div class="card" data-mode="music">
      <h2 data-t="music"></h2>
      <div class="seg" id="musKind"></div>
      <p class="hint" data-t="musicHint"></p>
    </div>
    <div class="card" data-mode="dino">
      <h2 data-t="game"></h2>
      <div class="btns"><button class="btn pri" id="jump" style="flex:1;padding:18px;font-size:1.2em" data-t="jump"></button></div>
      <p class="hint"><span data-t="score"></span>: <b id="score">0</b> · <span data-t="best"></span>: <b id="best">0</b></p>
    </div>
  </div>

  <!-- Ears -->
  <div class="tab" id="tab-ears">
    <div class="card">
      <h2 data-t="ears"></h2>
      <div class="rings"><canvas id="earL" width="220" height="220"></canvas><canvas id="earR" width="220" height="220"></canvas></div>
      <div class="seg" id="earFx" style="margin-top:12px"></div>
      <p class="hint" id="earHint"></p>
      <div class="row"><span class="lab" data-t="colour"></span><div class="ctl"><input type="color" id="earColor"></div></div>
      <div class="row"><span class="lab" data-t="brightness"></span><div class="ctl"><input type="range" id="earBr" min="0" max="1" step="0.05"><span class="val" id="earBrV"></span></div></div>
      <div class="btns"><button class="btn" id="earTest" data-t="earTest"></button></div>
    </div>
  </div>

  <!-- Settings -->
  <div class="tab" id="tab-settings">
    <div class="search">
      <input type="text" id="find" data-tp="search">
      <button class="chip" id="allBtn"></button>
    </div>
    <p class="hint" data-t="settingsHint" style="margin:0 2px 10px"></p>
    <div id="groups"></div>
    <div class="btns" style="margin:4px 0 14px"><button class="btn danger" id="resetAll" data-t="resetAll"></button></div>
  </div>

  <!-- System -->
  <div class="tab" id="tab-system">
    <div class="card">
      <h2 data-t="device"></h2>
      <div id="devInfo" class="hint"></div>
      <pre class="log" id="errors" style="display:none"></pre>
    </div>
    <div class="card">
      <h2 data-t="mic"></h2>
      <p class="hint" data-t="micHint"></p>
      <div class="row"><span class="lab" data-t="micMargin"></span><div class="ctl"><input type="range" id="mM" min="0" max="20" step="1"><span class="val" id="mMV"></span></div></div>
      <div class="row"><span class="lab" data-t="micGain"></span><div class="ctl"><input type="range" id="mG" min="1" max="50" step="1"><span class="val" id="mGV"></span></div></div>
      <div class="row"><span class="lab" data-t="micAmp"></span><div class="ctl"><input type="range" id="mA" min="1" max="30" step="1"><span class="val" id="mAV"></span></div></div>
      <div class="row"><span class="lab" data-t="micSmooth"></span><div class="ctl"><input type="range" id="mS" min="0" max="95" step="5"><span class="val" id="mSV"></span></div></div>
      <div class="btns"><button class="btn" id="micCal" data-t="micCal"></button></div>
    </div>
    <div class="card">
      <h2 data-t="myEmotions"></h2>
      <p class="hint" data-t="myEmotionsHint"></p>
      <div class="row"><span class="lab" data-t="ceName"></span><div class="ctl"><input type="text" id="ceLabel" maxlength="24"><input type="text" id="ceEmoji" maxlength="4" value="⭐" style="flex:0 0 4em;text-align:center"></div></div>
      <div class="row"><span class="lab" data-t="ceEye"></span><div class="ctl"><input type="file" id="ceEye" accept="image/*"></div></div>
      <div class="row"><span class="lab" data-t="ceMouthC"></span><div class="ctl"><input type="file" id="ceMouthC" accept="image/*"></div></div>
      <div class="row"><span class="lab" data-t="ceMouthO"></span><div class="ctl"><input type="file" id="ceMouthO" accept="image/*"></div></div>
      <div class="row"><span class="lab" data-t="ceBlink"></span><div class="ctl"><input type="file" id="ceBlink" accept="image/*"></div></div>
      <div class="btns"><button class="btn pri" id="ceAdd" data-t="add"></button></div>
      <div id="ceList" style="margin-top:8px"></div>
    </div>
    <div class="card" id="cardWifi">
      <h2>Wi-Fi</h2>
      <div class="hint" id="wfState"></div>
      <div class="row"><span class="lab" data-t="wfNet"></span><div class="ctl">
        <input type="text" id="wfSsid" list="wfList" maxlength="32" autocomplete="off" autocapitalize="off"><datalist id="wfList"></datalist>
        <button class="btn" id="wfScan" title="">🔍</button></div></div>
      <div class="row"><span class="lab" data-t="wfPass"></span><div class="ctl">
        <input type="password" id="wfPw" maxlength="64" autocomplete="off" style="flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0">
        <button class="btn" id="wfShow">👁</button></div></div>
      <div class="btns"><button class="btn pri" id="wfGo" data-t="wfConnect"></button></div>
      <p class="hint" data-t="wfHint"></p>
    </div>
    <div class="card">
      <h2 data-t="update"></h2>
      <div class="hint" id="ver"></div>
      <div class="btns" style="margin-top:10px">
        <button class="btn" id="updCheck" data-t="updCheck"></button>
        <button class="btn pri" id="updApply" style="display:none" data-t="updInstall"></button>
        <button class="btn danger" id="updForce" style="display:none" data-t="updForce"></button>
      </div>
      <pre class="log" id="updMsg" style="display:none"></pre>
    </div>
    <div class="card">
      <h2 data-t="power"></h2>
      <div class="btns">
        <button class="btn" id="restart" data-t="restart"></button>
        <button class="btn danger" id="reboot" data-t="reboot"></button>
        <a class="btn" href="/classic" data-t="classic" style="text-decoration:none"></a>
      </div>
    </div>
  </div>

  <!-- Simulator (only in the simulator) -->
  <div class="tab" id="tab-sim">
    <div class="card">
      <h2 data-t="simSound"></h2>
      <div class="seg" id="simSnd"></div>
      <div class="row"><span class="lab" data-t="simLevel"></span><div class="ctl"><input type="range" id="simLevel" min="0" max="1" step="0.05"><span class="val" id="simLevelV"></span></div></div>
    </div>
    <div class="card">
      <h2 data-t="simGestures"></h2>
      <div class="btns" id="simGest"></div>
    </div>
    <div class="card">
      <h2 data-t="simTime"></h2>
      <div class="seg" id="simSpeed"></div>
      <div class="row"><span class="lab" data-t="simPause"></span><div class="ctl"><div class="sw" id="simPause"></div></div></div>
      <div class="row"><span class="lab" data-t="simNet"></span><div class="ctl"><div class="seg" id="simNet" style="flex:1"></div></div></div>
      <div class="row"><span class="lab" data-t="simLink"></span><div class="ctl"><div class="sw" id="simLink"></div><span class="hint" data-t="simLinkHint"></span></div></div>
    </div>
  </div>
</div>

<nav><div class="in" id="nav"></div></nav>
<div id="toast"></div>
<div id="sheet"><div class="box"><h3 id="shT"></h3><p id="shP"></p><div class="btns" id="shB"></div></div></div>

<script>
"use strict";
// language

// talking to the device
let online = true;
async function api(path, body, method) {
  const opt = { cache: "no-store" };
  if (body !== undefined) { opt.method = method || "POST"; opt.headers = { "Content-Type": "application/json" }; opt.body = JSON.stringify(body); }
  else if (method) opt.method = method;
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 6000); opt.signal = ctl.signal;
  try { const r = await fetch(path, opt); clearTimeout(timer); setOnline(true); return await r.json(); }
  catch (e) { clearTimeout(timer); setOnline(false); throw e; }
}
function setOnline(v) { if (v !== online) { online = v; $("offline").classList.toggle("on", !v); } }
function debounce(fn, ms) { let h; return (...a) => { clearTimeout(h); h = setTimeout(() => fn(...a), ms); }; }
let toastTimer;
function toast(msg) { const x = $("toast"); x.textContent = msg; x.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => x.classList.remove("on"), 2600); }
function sheet(title, text, buttons) {            // [[label, class, fn], ...]
  $("shT").textContent = title; $("shP").textContent = text; const b = $("shB"); b.innerHTML = "";
  buttons.forEach(([label, cls, fn]) => { const x = el("button", "btn " + (cls || ""), label); x.style.flex = "1"; x.onclick = () => { $("sheet").classList.remove("on"); fn && fn(); }; b.appendChild(x); });
  $("sheet").classList.add("on");
}
$("sheet").onclick = e => { if (e.target.id === "sheet") $("sheet").classList.remove("on"); };
const info = (title, text) => sheet(title, text, [[t("ok"), "pri"]]);
const ask = (text, fn) => sheet("", text, [[t("cancel"), ""], [t("yes"), "pri", fn]]);

// a control the user is moving must not jump back when the next status arrives
const touched = {};
const touch = k => { touched[k] = Date.now(); };
const quiet = k => !touched[k] || Date.now() - touched[k] > 2500;
const hex = c => "#" + c.map(v => Math.max(0, Math.min(255, v | 0)).toString(16).padStart(2, "0")).join("");
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

const TABS = [["face", "🙂", "tabFace"], ["look", "🎨", "tabLook"], ["show", "📺", "tabShow"], ["ears", "💡", "tabEars"],
              ["settings", "⚙️", "tabSettings"], ["system", "🔧", "tabSystem"], ["sim", "🧪", "tabSim"]];
let tab = "face";

  const nav = $("nav"); nav.innerHTML = "";
  TABS.forEach(([id, icon, key]) => {
    if (id === "sim" && !simulated) return;
    const b = el("button", id === tab ? "on" : ""); b.innerHTML = '<span class="i">' + icon + "</span>"; b.appendChild(document.createTextNode(t(key)));
    b.onclick = () => { tab = id; try { localStorage.setItem("pg_tab", id); } catch (e) {} showTab(); };

}

  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.id === "tab-" + tab));

  if (tab === "sim") loadSim();
}

}

  seg($("musKind"), MUSIC, settings.music_style, id => { setSetting("music_style", id); touch("mode"); setState({ mode: "music" }); markModes("music"); });

function drawRing(cv, leds) {
  const c = cv.getContext("2d"), n = leds.length, w = cv.width; c.clearRect(0, 0, w, w);
  leds.forEach((col, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n, x = w / 2 + Math.cos(a) * w * .36, y = w / 2 + Math.sin(a) * w * .36;
    c.beginPath(); c.arc(x, y, w * .075, 0, 7); c.fillStyle = "rgb(" + col.join(",") + ")"; c.shadowColor = c.fillStyle; c.shadowBlur = Math.max(...col) > 30 ? 14 : 0; c.fill();
    c.shadowBlur = 0; c.strokeStyle = "#2a2f3d"; c.lineWidth = 2; c.stroke(); });
}

// "no Wi-Fi" and "no internet" in the user's language, and show where to fix it
function netError(j) {

async function loadWifi() {

const updMsg = m => { $("updMsg").style.display = ""; $("updMsg").textContent = m; };
