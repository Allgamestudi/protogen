<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Protogen Control</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
  <h1><span class="dot" id="dot"></span><span class="title">Protogen Control</span></h1>

  <div class="section">
    <h2>Mode</h2>
    <div class="modes">
      <button class="mode" data-m="emotion"><span class="ico">😠</span>Emotion</button>
      <button class="mode" data-m="image"><span class="ico">🖼️</span>Image</button>
      <button class="mode" data-m="eq"><span class="ico">🎵</span>EQ</button>
    </div>
  </div>

  <div id="sec-emotion" class="section">
    <h2>Emotion</h2>
    <div class="emos" id="emos"></div>
    <div class="row" style="margin-top:14px">
      <label>Effect</label>
      <div class="effects">
        <button class="btn" data-eff="solid">Solid</button>
        <button class="btn" data-eff="rainbow">Rainbow</button>
      </div>
    </div>
    <div class="row">
      <label>Solid color</label>
      <input type="color" id="color" value="#ff1e1e">
      <span class="val" id="colorV">#FF1E1E</span>
    </div>
  </div>

  <div id="sec-image" class="section hidden">
    <h2>Upload image</h2>
    <label class="upload" id="dropzone" for="fileInp">
      <div class="big">📁</div>
      <div class="lab" id="dropLab">Click here to choose image<br>or drop file here</div>
      <input type="file" id="fileInp" accept="image/*">
    </label>
    <div class="upbtn">
      <button class="btn" onclick="document.getElementById('fileInp').click()">📂 Choose file</button>
    </div>
    <div id="preview">
      <div class="caption">Preview (64×32)</div>
      <img id="previewImg" width="256" alt="">
    </div>
  </div>

  <div id="sec-eq" class="section hidden">
    <h2>Audio settings</h2>
    <div class="row"><label>Noise margin</label>
      <input type="range" id="margin" min="0" max="20" step="1">
      <span class="val" id="marginV">— dB</span>
    </div>
    <div class="row"><label>Gain</label>
      <input type="range" id="gain" min="1" max="50" step="1">
      <span class="val" id="gainV">—</span>
    </div>
    <div class="row"><label>Amplify (raw)</label>
      <input type="range" id="amp" min="1" max="30" step="1">
      <span class="val" id="ampV">—×</span>
    </div>
    <div class="row"><label>Smoothing</label>
      <input type="range" id="smooth" min="0" max="95" step="5">
      <span class="val" id="smoothV">—%</span>
    </div>
    <div class="row" style="justify-content:flex-end;gap:10px">
      <button class="btn" onclick="cmd('C')">Recalibrate</button>
      <button class="btn warn" onclick="cmd('R')">Reset defaults</button>
    </div>
    <h2 style="margin-top:18px">Live spectrum</h2>
    <div id="bars"></div>
    <div class="grid" style="margin-top:14px">
      <div class="card"><div class="k">Status</div><div class="v" id="eqStatus">—</div></div>
      <div class="card"><div class="k">Port</div><div class="v s" id="eqPort">—</div></div>
      <div class="card"><div class="k">Packets/s</div><div class="v" id="eqRate">—</div></div>
      <div class="card"><div class="k">Uptime</div><div class="v" id="eqUp">—</div></div>
    </div>
  </div>

  <div class="section">
    <h2>Display</h2>
    <div class="row"><label>Brightness</label>
      <input type="range" id="bright" min="5" max="100">
      <span class="val" id="brightV">—%</span>
    </div>
    <div class="row"><label>Mirror (L↔R)</label><div class="switch" id="mir"></div></div>
    <div class="row"><label>Rotate 180°</label><div class="switch" id="rot"></div></div>
  </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
